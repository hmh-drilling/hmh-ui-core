name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    # Do not run the publishing workflow for the release commit it creates.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and validate version
        id: version_check
        run: |
          chmod +x ./scripts/check-version.sh
          ./scripts/check-version.sh

      - name: Build project
        run: npm run build

      - name: Bump version, commit, and create tag
        if: steps.version_check.outputs.should_bump == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

          VERSION="${{ steps.version_check.outputs.target_version }}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --ignore-scripts

          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"

          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Publishing version $VERSION to npm..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
